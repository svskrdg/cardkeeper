name: Build CardKeeper IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iPhone without signing
        run: |
          xcodebuild -project CardKeeper.xcodeproj -scheme CardKeeper \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/CardKeeper.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qr "$GITHUB_WORKSPACE/CardKeeper-unsigned.ipa" Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CardKeeper-unsigned-ipa
          path: CardKeeper-unsigned.ipa
          if-no-files-found: error
