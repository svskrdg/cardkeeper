name: CardKeeper
options:
  bundleIdPrefix: com.cardkeeper
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "CardKeeper uses the camera to scan business cards."
    INFOPLIST_KEY_NSContactsUsageDescription: "CardKeeper saves scanned business cards to Contacts."
    CODE_SIGNING_ALLOWED: NO
targets:
  CardKeeper:
    type: application
    platform: iOS
    sources:
      - path: CardKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardkeeper.businesscards
        PRODUCT_NAME: CardKeeper
        INFOPLIST_KEY_CFBundleDisplayName: CardKeeper
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        SUPPORTS_MACCATALYST: NO
schemes:
  CardKeeper:
    build:
      targets:
        CardKeeper: all
    run:
      config: Debug
    archive:
      config: Release
